<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Options Range Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background: #f5f7fb;
      color: #1f2937;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }
    h1 { margin-top: 0; }
    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      align-items: center;
    }
    input, button, select {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      font-size: 14px;
    }
    input { min-width: 220px; }
    button {
      background: #111827;
      color: white;
      cursor: pointer;
      border: none;
    }
    button:hover { opacity: 0.92; }
    .status {
      margin: 12px 0 20px;
      font-size: 14px;
      white-space: pre-wrap;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 14px;
    }
    th, td {
      border: 1px solid #e5e7eb;
      padding: 10px;
      text-align: left;
    }
    th { background: #f3f4f6; }
    .small {
      color: #6b7280;
      font-size: 13px;
    }
    .note {
      margin-top: 20px;
      padding: 12px;
      background: #eef2ff;
      border-radius: 8px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Options Range Calculator</h1>
    <p class="small">Version 2: MarketData.app options chain test.</p>

    <div class="row">
      <input id="apiKey" type="password" placeholder="Paste MarketData Token" />
      <input id="ticker" type="text" placeholder="Ticker (e.g. NFLX)" value="NFLX" />
      <button id="loadBtn">Load Options</button>
    </div>

    <div class="status" id="status">Waiting for input...</div>

    <div class="row">
      <label for="expiration"><strong>Expiration:</strong></label>
      <select id="expiration">
        <option value="">No expiration loaded yet</option>
      </select>

      <label for="optionType"><strong>Type:</strong></label>
      <select id="optionType">
        <option value="all">All</option>
        <option value="call">Calls</option>
        <option value="put">Puts</option>
      </select>
    </div>

    <table id="resultsTable">
      <thead>
        <tr>
          <th>Type</th>
          <th>Strike</th>
          <th>Expiration</th>
          <th>Bid</th>
          <th>Ask</th>
          <th>Mid</th>
          <th>Last</th>
          <th>Volume</th>
          <th>Open Interest</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td colspan="9">No data yet.</td>
        </tr>
      </tbody>
    </table>

    <div class="note">
      First goal: confirm expirations and option chain load correctly from MarketData.app.
    </div>
  </div>

 <script>
  const loadBtn = document.getElementById('loadBtn');
  const tickerInput = document.getElementById('ticker');
  const apiKeyInput = document.getElementById('apiKey');
  const expirationSelect = document.getElementById('expiration');
  const optionTypeSelect = document.getElementById('optionType');
  const statusDiv = document.getElementById('status');
  const tableBody = document.querySelector('#resultsTable tbody');

  let fullOptionsData = [];

  function safeNum(value) {
    return value === null || value === undefined || value === '' ? '' : Number(value).toFixed(2);
  }

  function renderTable(rows) {
    const selectedType = optionTypeSelect.value;
    let filteredRows = rows;

    if (selectedType !== 'all') {
      filteredRows = rows.filter(r => r.side === selectedType);
    }

    if (!filteredRows || filteredRows.length === 0) {
      tableBody.innerHTML = '<tr><td colspan="9">No options found for this selection.</td></tr>';
      return;
    }

    tableBody.innerHTML = filteredRows.slice(0, 100).map(row => {
      const bid = Number(row.bid || 0);
      const ask = Number(row.ask || 0);
      const mid = (bid > 0 && ask > 0) ? ((bid + ask) / 2).toFixed(2) : '';
      return `
        <tr>
          <td>${row.side || ''}</td>
          <td>${row.strike || ''}</td>
          <td>${row.expiration || ''}</td>
          <td>${safeNum(row.bid)}</td>
          <td>${safeNum(row.ask)}</td>
          <td>${mid}</td>
          <td>${safeNum(row.last)}</td>
          <td>${row.volume ?? ''}</td>
          <td>${row.openInterest ?? ''}</td>
        </tr>
      `;
    }).join('');
  }

  function populateExpirations(rows) {
    const expirations = [...new Set(rows.map(r => r.expiration).filter(Boolean))].sort();
    expirationSelect.innerHTML = '';

    if (expirations.length === 0) {
      expirationSelect.innerHTML = '<option value="">No expirations found</option>';
      return;
    }

    expirations.forEach(exp => {
      const option = document.createElement('option');
      option.value = exp;
      option.textContent = exp;
      expirationSelect.appendChild(option);
    });
  }

  function refreshFilteredView() {
    const exp = expirationSelect.value;
    const filtered = fullOptionsData.filter(item => item.expiration === exp);
    renderTable(filtered);
  }

  expirationSelect.addEventListener('change', refreshFilteredView);
  optionTypeSelect.addEventListener('change', refreshFilteredView);

  [tickerInput, apiKeyInput].forEach(input => {
    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        loadBtn.click();
      }
    });
  });

  loadBtn.addEventListener('click', async () => {
    const ticker = tickerInput.value.trim().toUpperCase();
    const token = apiKeyInput.value.trim();

    if (!ticker || !token) {
      statusDiv.textContent = 'Please enter ticker and token.';
      return;
    }

    statusDiv.textContent = 'Loading options data...';
    tableBody.innerHTML = '<tr><td colspan="9">Loading...</td></tr>';

    try {
      const url = `https://api.marketdata.app/v1/options/chain/${ticker}/?token=${encodeURIComponent(token)}`;
      const response = await fetch(url);
      const data = await response.json();

      if (!data || !data.s || data.s === 'error') {
        statusDiv.textContent = `API error: ${JSON.stringify(data)}`;
        tableBody.innerHTML = '<tr><td colspan="9">API returned an error.</td></tr>';
        return;
      }

      const len = (data.optionSymbol || []).length;
      fullOptionsData = [];

      for (let i = 0; i < len; i++) {
        const rawExpiration = data.expiration?.[i];
        const expirationDate = rawExpiration
          ? new Date(Number(rawExpiration) * 1000).toISOString().split('T')[0]
          : '';

        fullOptionsData.push({
          optionSymbol: data.optionSymbol?.[i],
          side: data.side?.[i],
          strike: data.strike?.[i],
          expiration: expirationDate,
          bid: data.bid?.[i],
          ask: data.ask?.[i],
          last: data.last?.[i],
          volume: data.volume?.[i],
          openInterest: data.openInterest?.[i]
        });
      }

      populateExpirations(fullOptionsData);
      refreshFilteredView();

      statusDiv.textContent = `Loaded ${fullOptionsData.length} contracts for ${ticker}.`;
    } catch (error) {
      console.error(error);
      statusDiv.textContent = `Error loading data: ${error.message}`;
      tableBody.innerHTML = '<tr><td colspan="9">Error loading data.</td></tr>';
    }
  });
</script>
